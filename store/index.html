<!DOCTYPE html>
<html>
<head>
    <title>Piattaforma Vendita</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            margin: 20px;
        }

        h2 {
            color: #333;
        }

        #prodotti {
            display: flex;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            width: 200px;
            padding: 10px;
            margin: 10px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .card h3 {
            margin: 0;
        }

        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background-color: #218838;
        }

        #carrello {
            background: white;
            padding: 10px;
            border: 2px solid black;
            width: 300px;
        }

        input {
            margin: 5px 0;
            padding: 5px;
        }
    </style>

</head>
<body>

<h2>Carica file CSV</h2>
<input type="file" id="fileInput">

<h2>Prodotti</h2>
<div id="prodotti"></div>

<h2>Registrazione</h2>
Nome: <input type="text" id="nome"><br>
Email: <input type="text" id="email"><br>
<button onclick="registrati()">Registrati</button>

<h2>Carrello</h2>
<div id="carrello"></div>
<button onclick="acquista()">Acquista</button>

<script src="script.js"></script>

</body>
</html>
