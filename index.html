<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Dashboard Meteo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Mini Dashboard Meteo</h1>
    <p class="intro">Scrivi il nome di una città e premi Cerca.</p>

    <div class="ricerca">
      <label for="citta">Città</label>
      <input type="text" id="citta" placeholder="Es. Torino">
      <button id="btnCerca">Cerca</button>
    </div>

    <p id="messaggio"></p>

    <section id="risultato" class="nascosto">
      <h2 id="nomeLuogo"></h2>

      <div class="attuale">
        <p>Temperatura: <strong id="temperatura"></strong></p>
        <p>Vento: <strong id="vento"></strong></p>
        <p>Condizione: <strong id="condizione"></strong></p>
      </div>

      <h3>Prossimi 3 giorni</h3>
      <table>
        <thead>
          <tr>
            <th>Giorno</th>
            <th>Min</th>
            <th>Max</th>
          </tr>
        </thead>
        <tbody id="previsioni"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
